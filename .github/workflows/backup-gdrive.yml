name: Backup settimanale su Google Drive

on:
  schedule:
    - cron: '0 3 * * 0'   # Ogni domenica alle 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v6

      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Crea archivio ZIP dei file
        run: |
          zip -r backup-vuotoperfetto-${{ steps.timestamp.outputs.timestamp }}.zip . -x ".git/*" -x "node_modules/*"

      - name: Carica su Google Drive
        uses: logickoder/g-drive-upload@main
        with:
          authType: 'oauth'
          clientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          clientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refreshToken: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          filename: 'backup-vuotoperfetto-${{ steps.timestamp.outputs.timestamp }}.zip'
          folderId: '1Xr6eNieLw0JEdLQ02GUmz7UA3oPa_SW-'
