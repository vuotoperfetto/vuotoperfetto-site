name: Backup settimanale configurazione Cloudflare

on:
  schedule:
    - cron: '0 4 * * 0'   # Ogni domenica alle 04:00 UTC (06:00 ora italiana)
  workflow_dispatch:        # Permette l'avvio manuale

jobs:
  backup-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v6

      - name: Recupera impostazioni progetto Cloudflare
        run: |
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/${{ secrets.CF_PAGES_PROJECT }}" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -o cloudflare-settings-$(date +%Y%m%d).json

      - name: Carica su Google Drive
        uses: logickoder/g-drive-upload@main
        with:
          authType: 'oauth'
          clientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          clientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refreshToken: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          filename: 'cloudflare-settings-$(date +%Y%m%d).json'
          folderId: '1Xr6eNieLw0JEdLQ02GUmz7UA3oPa_SW-'
