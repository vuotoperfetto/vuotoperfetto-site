name: Backup settimanale configurazione Cloudflare

on:
  schedule:
    - cron: '0 4 * * 0'   # Ogni domenica alle 04:00 UTC
  workflow_dispatch:

jobs:
  backup-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v6

      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Recupera impostazioni progetto Cloudflare
        run: |
          curl -sS --fail \
            -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/${{ secrets.CF_PAGES_PROJECT }}" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -o cloudflare-settings-${{ steps.timestamp.outputs.timestamp }}.json

      - name: Verifica che il file sia stato creato
        run: |
          ls -la cloudflare-settings-${{ steps.timestamp.outputs.timestamp }}.json
          head -c 200 cloudflare-settings-${{ steps.timestamp.outputs.timestamp }}.json

      - name: Carica su Google Drive
        uses: logickoder/g-drive-upload@main
        with:
          authType: 'oauth'
          clientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          clientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refreshToken: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          filename: 'cloudflare-settings-${{ steps.timestamp.outputs.timestamp }}.json'
          folderId: '1Xr6eNieLw0JEdLQ02GUmz7UA3oPa_SW-'
